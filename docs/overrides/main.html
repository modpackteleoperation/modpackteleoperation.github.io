{% extends "base.html" %}

{% block extrahead %}
  <script type="importmap">
  {
    "imports": {
      "three": "/assets/vendor/three/three.module.js",
      "three/addons/": "/assets/vendor/three/addons/"
    }
  }
  </script>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var logo = document.querySelector(".md-header__button.md-logo");
      if (logo) {
        logo.href = "/";
        logo.title = "← Back to project page";
      }
      var title = document.querySelector(".md-header__title a");
      if (title) {
        title.href = "/";
        title.title = "← Back to project page";
      }
    });
  </script>
{% endblock %}
