site_name: ModPack
site_url: https://modpackteleoperation.github.io/docs/
site_description: Documentation for ModPack, an open-source teleoperation backpack for bimanual mobile robots. Bill of materials, assembly guides, and software setup.
docs_dir: docs-src
site_dir: docs

# Header repo link (top-right corner on every docs page).
repo_url: https://github.com/modpackteleoperation/modpack
repo_name: ModPack
edit_uri: ""

theme:
  name: material
  custom_dir: docs-src/overrides
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    primary: custom
  homepage: /
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

plugins:
  - search
  - macros

# Single source of truth for links into the code repo. Used in pages as {{ repo_blob }}.
extra:
  repo_blob: "https://github.com/modpackteleoperation/modpack/blob/main"

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/slideshow.js
  - javascripts/mathjax.js
  - javascripts/model-viewer.js
  - /assets/vendor/mathjax/tex-mml-chtml.js
  - /assets/vendor/mermaid.min.js

nav:
  - Home: index.md
  - Bill of Materials: bom.md
  - Assembly:
    - Overview: assembly/index.md
    - Backpack Build: assembly/backpack.md
    - Backpack Wiring: assembly/wiring.md
    - Arm Integration: assembly/arms.md
  - Software:
    - Overview: software/index.md
    - Configuration: software/configuration.md
    - Modules: software/modules.md
